<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Face B introuvable | Nyle Kersen Joseph</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --espresso-950: #2B1916;
        --espresso-900: #3E2522;
        --caramel-400: #D3A376;
        --amber-500: #E8892E;
        --cream-100: #FFF2DF;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--espresso-950);
        color: var(--cream-100);
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background-image: radial-gradient(circle at 50% 20%, rgba(232, 137, 46, 0.15), transparent 70%);
      }
      .number {
        font-size: clamp(80px, 18vw, 160px);
        font-weight: 900;
        line-height: 1;
        color: var(--amber-500);
        letter-spacing: -4px;
        margin: 0;
      }
      .title {
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 700;
        margin: 12px 0 8px;
        color: var(--cream-100);
      }
      .desc {
        color: var(--caramel-400);
        max-width: 480px;
        margin: 0 auto 28px;
        font-size: 16px;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        background-color: var(--amber-500);
        color: var(--espresso-950);
        padding: 14px 28px;
        border-radius: 9999px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s, background-color 0.2s;
      }
      .btn:hover {
        background-color: #A8470F;
        color: var(--cream-100);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="number">404</div>
    <h1 class="title">Face B introuvable · Track Not Found</h1>
    <p class="desc">
      Ce sillon semble rayé ou le vinyle a été déplacé. Retournez à l'écoute sur la face principale.
    </p>
    <a href="/" class="btn">Retourner à l'accueil / Back to Vinyl</a>
  </body>
</html>
